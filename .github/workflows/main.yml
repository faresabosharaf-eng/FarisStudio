name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FarisStudio.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --stacktrace
        working-directory: FarisStudio
      - uses: actions/upload-artifact@v4
        with:
          name: FarisStudio-debug-apk
          path: FarisStudio/app/build/outputs/apk/debug/*.apk
